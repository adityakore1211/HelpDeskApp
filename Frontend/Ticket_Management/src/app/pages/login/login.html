<div class="login">
  <div class="login-card">

    <!-- Brand Section -->
    <div class="brand">
      <div class="brand-icon">
        <img class="img" src="Vintech.png" alt="Vintech Logo">
      </div>

      <h1>Help Desk</h1>
      <h3>Ticket Management System</h3>
      <p>Sign in to your account</p>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" [(ngModel)]="username" placeholder="Enter username or email"
          required #usernameField="ngModel">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Enter your password"
          required #passwordField="ngModel">
      </div>

      <div class="forgot-password">
        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>

      <div class="register-link">
        <span>Don't have an account?</span>
        <a routerLink="/register">Register here</a>
      </div>
    </form>

  </div>
</div>
