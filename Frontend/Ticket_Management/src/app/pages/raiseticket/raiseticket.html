<div class="raiseticket">
  <div class="ticket-card">

    <div class="brand">
      <img src="/Vintech.png" alt="Vintech Logo" class="img">

      <h1>Raise a Ticket</h1>
      <h3>Help Desk Ticket Management System</h3>
      <p>Describe your issue and we'll help you resolve it.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #ticketForm="ngForm">
      <div class="form-group">
        <label for="title">Ticket Title</label>
        <input type="text" id="title" name="title" [(ngModel)]="title" placeholder="Enter ticket title" minlength="5"
          required>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" [(ngModel)]="description"
          placeholder="Describe your issue in detail" minlength="10" rows="4" required></textarea>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category" [(ngModel)]="category" required>
          <option value="" disabled>Select category</option>
          <option value="Technical">Technical</option>
          <option value="Access">Access</option>
          <option value="Hardware">Hardware</option>
          <option value="Software">Software</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email address" required>
      </div>

      <div class="form-group">
        <label for="department">Department</label>
        <select id="department" name="department" [(ngModel)]="department" required>
          <option value="" disabled>Select department</option>
          <option value="IT">IT</option>
          <option value="HR">HR</option>
          <option value="Finance">Finance</option>
          <option value="Sales">Sales</option>
          <option value="Operations">Operations</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="location">Location</label>
        <input type="text" id="location" name="location" [(ngModel)]="location" placeholder="Enter office location"
          required>
      </div>

      <button type="submit" class="submit-btn" [disabled]="ticketForm.invalid || isLoading">
        {{ isLoading ? 'Submitting...' : 'Submit Ticket' }}
      </button>

      <div class="back-link">
        <a routerLink="/dashboard">Back to Dashboard</a>
      </div>

    </form>
  </div>
</div>
